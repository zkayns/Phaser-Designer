<!DOCTYPE html>
<html>
    <head>
        <title>Phaser Designer</title>
        <link rel='stylesheet' href='style.css'>
        <script src='https://code.jquery.com/jquery-4.0.0.js'></script>
    </head>
    <body>
        <input id='width' value=20 class='smallInput' type='number' placeholder='Width'>
        <input id='height' value=20 class='smallInput' type='number' placeholder='Height'>
        <br>
        <input id='pixelWidth' value=1 class='smallInput' type='number' placeholder='Pixel Width'>
        <input id='pixelHeight' value=1 class='smallInput' type='number' placeholder='Pixel Height'>
        <table id='spriteTable'>
        </table>
        <table id='paletteTable'>
            <tr>
                <td><input type='color' id='col1'></td>
                <td><input type='color' id='col2'></td>
                <td><input type='color' id='col3'></td>
                <td><input type='color' id='col4'></td>
                <td><input type='color' id='col5'></td>
                <td><input type='color' id='col6'></td>
                <td><input type='color' id='col7'></td>
                <td><input type='color' id='col8'></td>
            </tr>
            <tr>
                <td><input type='color' id='col9'></td>
                <td><input type='color' id='col10'></td>
                <td><input type='color' id='col11'></td>
                <td><input type='color' id='col12'></td>
                <td><input type='color' id='col13'></td>
                <td><input type='color' id='col14'></td>
                <td><input type='color' id='col15'></td>
                <td><input type='color' id='col16'></td>
            </tr>
        </table>
        <textarea id="output"></textarea>
    </body>
    <script src='main.js'></script>
</html>
